event_loop:
  completion_judge:
    command: ["ralph-jev-judge"]
    timeout_seconds: 60
    max_rejections: 3
    fail_closed: false

hooks:
  enabled: true
  events:
    pre.loop.start:
      - name: jev-triage
        command: ["ralph-jev-hook", "triage"]
        on_error: warn
        mutate:
          enabled: true
    pre.iteration.start:
      - name: jev-progress
        command: ["ralph-jev-hook", "progress"]
        on_error: warn
        mutate:
          enabled: true
